<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Webhook Scheduler</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow bg-glow-secondary"></div>
    
    <div class="container">
        <header>
            <h1>Signal URL Scheduler</h1>
            <p>Precise UTC+7 scheduling engine</p>
            <div class="nav-tabs">
                <button class="tab-btn active" id="tab-schedules">Schedules</button>
                <button class="tab-btn" id="tab-logs">Execution Logs</button>
            </div>
        </header>

        <main id="view-schedules">
            <section class="glass-panel add-schedule-section">
                <h2 id="form-title">Add New Schedule</h2>
                <form id="schedule-form">
                    <input type="hidden" id="edit-id">
                    
                    <div class="form-group">
                        <label for="schedule-name">Schedule Name</label>
                        <input type="text" id="schedule-name" placeholder="e.g. Daily Data Sync" required>
                    </div>

                    <div class="form-group">
                        <label for="schedule-type">Execution Type</label>
                        <select id="schedule-type" class="custom-select" required>
                            <option value="once">Run Once (Specific Date & Time)</option>
                            <option value="minutes">Recurring: Every X Minutes</option>
                            <option value="hours">Recurring: Every X Hours</option>
                            <option value="daily">Recurring: Daily (HH:mm)</option>
                            <option value="weekly">Recurring: Weekly (Weekday HH:mm)</option>
                        </select>
                    </div>

                    <!-- Dynamic Parameter Fields -->
                    <div id="param-once" class="param-group">
                        <div class="form-group">
                            <label for="param-once-time">Date and Time (UTC+7 Local)</label>
                            <input type="datetime-local" id="param-once-time">
                        </div>
                    </div>

                    <div id="param-minutes" class="param-group hidden">
                        <div class="form-group">
                            <label for="param-minutes-val">Run every X minutes</label>
                            <input type="number" id="param-minutes-val" min="1" placeholder="e.g. 15">
                        </div>
                    </div>

                    <div id="param-hours" class="param-group hidden">
                        <div class="form-group">
                            <label for="param-hours-val">Run every X hours</label>
                            <input type="number" id="param-hours-val" min="1" placeholder="e.g. 4">
                        </div>
                    </div>

                    <div id="param-interval-start" class="param-group hidden">
                        <div class="form-group">
                            <label for="param-interval-start-time">Initial Start At (Local Time)</label>
                            <input type="datetime-local" id="param-interval-start-time">
                        </div>
                    </div>

                    <div id="param-daily" class="param-group hidden">
                        <div class="form-group">
                            <label for="param-daily-time">Time of Day (HH:mm)</label>
                            <input type="time" id="param-daily-time">
                        </div>
                    </div>

                    <div id="param-weekly" class="param-group hidden">
                        <div class="form-group split">
                            <div>
                                <label for="param-weekly-day">Day of Week</label>
                                <select id="param-weekly-day" class="custom-select">
                                    <option value="1">Monday</option>
                                    <option value="2">Tuesday</option>
                                    <option value="3">Wednesday</option>
                                    <option value="4">Thursday</option>
                                    <option value="5">Friday</option>
                                    <option value="6">Saturday</option>
                                    <option value="0">Sunday</option>
                                </select>
                            </div>
                            <div>
                                <label for="param-weekly-time">Time</label>
                                <input type="time" id="param-weekly-time" placeholder="00:00">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="webhook-url">Webhook URL</label>
                        <input type="url" id="webhook-url" placeholder="https://api.example.com/webhook" required>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="submit-btn" style="flex: 1">
                            <span id="submit-btn-text">Save Schedule</span>
                            <div class="spinner hidden"></div>
                        </button>
                        <button type="button" class="btn-secondary hidden" id="cancel-edit-btn">Cancel Edit</button>
                    </div>
                    <div id="form-message" class="message hidden"></div>
                </form>
            </section>

            <section class="glass-panel list-schedule-section">
                <h2>Active Schedules</h2>
                <div class="schedules-container" id="schedules-list">
                    <div class="loading-state">Loading schedules...</div>
                </div>
            </section>
        </main>

        <main id="view-logs" class="hidden">
            <section class="glass-panel">
                <div class="header-split">
                    <h2>Execution Logs</h2>
                    <button id="clear-logs-btn" class="btn-danger btn-sm">Clear Logs</button>
                </div>
                <div class="logs-container" id="logs-list">
                    <div class="loading-state">Loading logs...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Template for Schedule -->
    <template id="schedule-template">
        <div class="schedule-card">
            <div class="schedule-main">
                <h3 class="sch-title"></h3>
                <div class="sch-meta">
                    <span class="sch-type-badge"></span>
                    <span class="sch-url"></span>
                </div>
            </div>
            
            <div class="schedule-actions">
                <label class="toggle-switch" title="Toggle Active">
                    <input type="checkbox" class="sch-active-toggle">
                    <span class="slider"></span>
                </label>
                <button class="btn-icon edit-btn" title="Edit">✏️</button>
                <button class="btn-icon delete-btn" title="Delete">🗑️</button>
            </div>
        </div>
    </template>

    <!-- Template for Log -->
    <template id="log-template">
        <div class="log-item">
            <div class="log-time"></div>
            <div class="log-content">
                <strong class="log-name"></strong>
                <span class="log-url"></span>
                <div class="log-status"></div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
