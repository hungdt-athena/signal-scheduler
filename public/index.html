<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow bg-glow-secondary"></div>
    
    <div class="container">
        <header>
            <h1>Webhook Scheduler</h1>
            <p>Automate your API calls with precision.</p>
        </header>

        <main>
            <section class="glass-panel add-schedule-section">
                <h2>Add New Schedule</h2>
                <form id="schedule-form">
                    <div class="form-group">
                        <label for="target-time">Execution Time</label>
                        <input type="datetime-local" id="target-time" required>
                    </div>
                    <div class="form-group">
                        <label for="webhook-url">Webhook URL</label>
                        <input type="url" id="webhook-url" placeholder="https://api.example.com/webhook" required>
                    </div>
                    <button type="submit" class="btn-primary" id="submit-btn">
                        <span>Schedule Task</span>
                        <div class="spinner hidden"></div>
                    </button>
                    <div id="form-message" class="message hidden"></div>
                </form>
            </section>

            <section class="glass-panel list-schedule-section">
                <h2>Active Schedules</h2>
                <div class="schedules-container" id="schedules-list">
                    <div class="loading-state">Loading schedules...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Template for a schedule card -->
    <template id="schedule-template">
        <div class="schedule-card">
            <div class="schedule-info">
                <div class="time-badge">
                    <span class="date"></span>
                    <span class="time"></span>
                    <div class="pulse-indicator"></div>
                </div>
                <div class="url-text"></div>
            </div>
            <button class="btn-danger delete-btn" title="Cancel Schedule">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
